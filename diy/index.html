<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DIY builds</title>
<link rel="icon" type="image/png" href="../img/me.png">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { --text:#202020; --muted:#6b6b6b; --link:#3273dc; --bg:#f5f5f5; --card:#ffffff; --line:#dcdcdc; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:"EB Garamond", Georgia, "Times New Roman", serif; font-size:18px; line-height:1.5;
         -webkit-font-smoothing:antialiased; }
  #gate { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:36px 40px; max-width:440px; width:100%;
          box-shadow:0 2px 3px rgba(10,10,10,.1); text-align:center; }
  .lock { font-size:34px; margin-bottom:8px; }
  h1 { font-size:26px; font-weight:600; margin:0 0 6px; }
  p.sub { color:var(--muted); margin:0 0 22px; }
  form { display:flex; gap:8px; }
  input { flex:1; font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--text); }
  input:focus { outline:2px solid var(--link); outline-offset:1px; border-color:var(--link); }
  button { font:inherit; padding:9px 16px; border:1px solid var(--link); background:var(--link); color:#fff; border-radius:6px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:progress; }
  #status { min-height:1.5em; margin:12px 0 0; color:var(--muted); font-size:16px; }
  #status.err { color:#b3261e; }
  .back { display:block; margin-top:18px; font-size:15px; color:var(--link); text-decoration:none; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; display:none; background:#eceae3; }
  body.open #gate { display:none; } body.open #app { display:block; }
  #lockbtn { position:fixed; right:10px; bottom:10px; z-index:2; display:none; font-size:13px; padding:4px 10px; background:rgba(255,255,255,.85); color:var(--text); border:1px solid var(--line); }
  body.open #lockbtn { display:block; }
</style>
</head>
<body>
<section id="gate">
  <div class="card">
    <div class="lock" aria-hidden="true">&#128274;</div>
    <h1>DIY builds</h1>
    <p class="sub">This page is private. Enter the passphrase to continue.</p>
    <form id="form" autocomplete="off">
      <input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password" aria-label="Passphrase" required>
      <button id="go" type="submit">Open</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <a class="back" href="../">&larr; back to aliang8.github.io</a>
  </div>
</section>
<iframe id="app" title="DIY builds"></iframe>
<button id="lockbtn" type="button" title="Forget the passphrase for this tab">Lock</button>

<script>
// Static, client-side vault: nothing on the server can read the content. The passphrase never leaves the
// browser; PBKDF2 (600k iterations, SHA-256) derives an AES-256-GCM key, each vault/*.enc is IV||ciphertext of
// a gzip stream, decrypted with WebCrypto and rendered into an iframe from a blob: URL. Requires https (or
// localhost): WebCrypto is only available in secure contexts, so opening this file from disk will not work.
const VAULT = 'vault/';
let manifest = null, key = null, localHook = false;
const mediaCache = new Map();
const $ = (id) => document.getElementById(id);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function loadManifest() {
  if (manifest) return manifest;
  const r = await fetch(VAULT + 'manifest.json', { cache: 'no-store' });
  if (!r.ok) throw new Error('vault manifest missing');
  return (manifest = await r.json());
}
async function deriveKey(pass) {
  const m = await loadManifest();
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: m.kdf.hash, salt: b64(m.kdf.salt), iterations: m.kdf.iterations },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function gunzip(bytes) {
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function decryptEntry(file) {
  const r = await fetch(VAULT + file, { cache: 'no-store' });
  if (!r.ok) throw new Error('missing vault file ' + file);
  const packed = new Uint8Array(await r.arrayBuffer());
  const plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: packed.slice(0, 12) }, key, packed.slice(12)));
  return manifest.compression === 'gzip' ? gunzip(plain) : plain;
}
async function mediaUrl(name) {
  if (mediaCache.has(name)) return mediaCache.get(name);
  const e = manifest.media[name];
  if (!e) throw new Error('not in the vault: ' + name);
  const url = URL.createObjectURL(new Blob([await decryptEntry(e.file)], { type: e.mime }));
  mediaCache.set(name, url); return url;
}
// The viewer reports its state (model, step, part) so this page's URL stays a shareable deep link.
window.addEventListener('message', (ev) => {
  const m = ev.data; if (!m || m.type !== 'vault-state') return;
  try { history.replaceState(null, '', location.pathname + (m.query ? '?' + m.query : '')); } catch (e) {}
});
// The viewer asks for print files by relative name; answer with a decrypted object URL.
window.addEventListener('message', async (ev) => {
  const m = ev.data; if (!m || m.type !== 'vault-media') return;
  const reply = (extra) => ev.source && ev.source.postMessage({ type: 'vault-media-reply', id: m.id, ...extra }, '*');
  try { reply({ url: await mediaUrl(m.name) }); } catch (e) { reply({ error: String(e.message || e) }); }
});

const status = (t, err) => { const s = $('status'); s.textContent = t; s.className = err ? 'err' : ''; };
async function open_(pass, remember) {
  $('go').disabled = true; status('Deriving key…');
  try {
    key = await deriveKey(pass);
    status('Decrypting…');
    const html = new TextDecoder().decode(await decryptEntry(manifest.pages[manifest.home].file));
    // Forward this page's query (model, step, part…) to the viewer through the blob URL's hash.
    const q = new URLSearchParams(location.search); q.delete('pass');
    const src = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    const frame = $('app');
    frame.src = src + (q.toString() ? '#' + q.toString() : '');   // hash: blob: URLs must not carry a query
    if (remember) sessionStorage.setItem('diy.pass', pass);
    document.body.classList.add('open'); status('');
    window.__vault = { open: true, media: Object.keys(manifest.media).length };
    if (localHook) {   // verification only: prove a print file decrypts to an object URL
      const first = Object.keys(manifest.media)[0];
      mediaUrl(first).then((u) => { window.__vault.mediaTest = { name: first, url: u }; console.log('VAULT media test', first, u); });
    }
  } catch (e) {
    key = null; sessionStorage.removeItem('diy.pass');
    status(/OperationError|decrypt/i.test(String(e)) || e.name === 'OperationError' ? 'Wrong passphrase.' : 'Could not open: ' + (e.message || e), true);
  } finally { $('go').disabled = false; }
}
$('form').addEventListener('submit', (e) => { e.preventDefault(); open_($('pass').value, true); });
$('lockbtn').addEventListener('click', () => { sessionStorage.removeItem('diy.pass'); location.href = location.pathname; });

(async () => {
  if (!window.isSecureContext || !crypto.subtle) { status('This page needs https (WebCrypto is unavailable here).', true); return; }
  const saved = sessionStorage.getItem('diy.pass');
  // Test hook: ?pass=… auto-submits, but ONLY when served from this machine (headless verification). On the
  // public host the parameter is ignored, so a passphrase can never be smuggled through a shared URL.
  const local = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
  const hook = local ? new URLSearchParams(location.search).get('pass') : null;
  localHook = !!hook;
  if (saved) open_(saved, false); else if (hook) open_(hook, false); else $('pass').focus();
})();
</script>
</body>
</html>
